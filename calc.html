        #txtInput,

        /* Both layers use identical font-size, font-family, line-height, padding-left/right, and vertical centering */
/* Remove top/bottom padding so that text is centered via line-height */
#highlightLayer,
#txtInput {
    position: absolute;
    top: 0;
    right: 0;
    left: auto;
    width: 100%;
    /* Use the same font settings */
    font-family: "Segoe UI", sans-serif;
    font-size: 1.5rem;
    line-height: 2.5rem; /* exactly matches container height */
    white-space: nowrap;
    overflow: hidden;
    text-align: right;
    padding: 0 10px; /* horizontal padding; matches both layers */
    /* No vertical padding, so text vertically centered by line-height */
}

/* inner LTR wrapper used inside the RTL contenteditable so clicks align to visual characters */
.inner-ltr {
    direction: ltr;
    unicode-bidi: isolate;
    display: inline-block;
}

/* Ensure the text color for txtInput stays transparent, caret-color transparent */

/* Replace input styling with contenteditable div styling */
/* Invisible contenteditable input used for selection/caret; anchor at right so visual clicks map correctly */
#txtInput {
    position: absolute;
    top: 0; right: 0; left: auto;
    width: 100%;
    font-family: "Segoe UI", sans-serif;
    font-size: 1.5rem;
    line-height: 2.5rem; /* match container height */
    white-space: nowrap;
    direction: rtl; /* align contenteditable to the right so clicks map visually from right */
    overflow-x: auto; /* allow horizontal scroll to keep caret visible */
    text-align: right;
    color: transparent; /* keep text invisible; highlightLayer shows formatted text */
    caret-color: transparent; /* hide native caret */
    outline: none;
    padding: 0 10px;
    z-index: 1;
}

/* On small screens, likewise adjust line-height/font-size/padding to match highlightLayer */
@media (max-width: 320px) {
    #txtInput {
        font-size: 1.3rem;
        line-height: 2.2rem;
        padding: 0 8px;
    }
}

/* The highlightLayer spans will show colored text; text is vertically centered by same line-height */
#highlightLayer {
    pointer-events: none;
    color: transparent;
    z-index: 2;
    overflow-x: hidden; /* hide overflow, sync scroll via JS */
    direction: rtl; /* keep highlight aligned to the right */
}
        
        @media (max-width: 320px) {
            #highlightLayer, 
            #txtInput {
                font-size: 1.3rem;
                padding: 0px 8px;
                line-height: 2.2rem;
            }
            .input-container { height: 2.2rem; }
            .grid button {
                font-size: 1rem;
                text-align: right;
            }
        }
        /* Custom caret */
        #customCaret {
            position: absolute;
            width: 1px;
            background-color: var(--input-text);
            animation: blink var(--caret-blink-interval) step-end infinite;
            visibility: visible; /* always visible */
            z-index: 3;
            pointer-events: none;
        }
        @keyframes blink {
            0%, 50% { visibility: visible; }
            51%, 100% { visibility: hidden; }
        }
        #answerDisplay {
            padding: 4px 10px;
            font-size: 1rem;
            min-height: 1.2rem;
            color: var(--input-number-color);
            text-align: right;
            background-color: var(--input-bg);
            opacity: 1;
        }
        .animate-answer {
            animation-name: fadeInUp;
            animation-fill-mode: forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(6, 56px);
            gap: 1px;
            background-color: #111;
        }
        .grid button {
            font-size: 1.2rem;
            border: none;
            background-color: var(--button-bg);
            color: var(--button-text);
            outline: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .grid button.operator {
            color: var(--operator-color);

        #btnOpPercent {

        .grid button#btnC {

        .grid button:disabled {
            opacity: 0.4;

        }
        .grid button:hover:not(:disabled) {
            background-color: #666;
        }
        .grid button:active:not(:disabled) {
            transform: scale(0.95);
        }
        .grid button:focus {
            outline: 2px solid var(--operator-color);
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--history-bg);
            display: none;
            justify-content: center;

            height: 4px;

        /* ========== HISTORY TOKEN: prevent stretching, allow internal horizontal scroll ========== */
/* Target the history item span we will create as .history-token */
#historyList .history-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

#historyList .history-item .history-token {
  display: inline-block;
  flex: 1 1 auto;          /* can shrink inside the list item */
  min-width: 0;            /* allow shrinking inside flex */
  max-width: 100%;         /* never stretch parent */
  white-space: nowrap;     /* keep single line -> horizontal scroll */
  overflow-x: auto;        /* allow horizontal scroll for long tokens */
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;     /* let vertical scroll bubble to panel by default */
  cursor: pointer;
  padding: 6px 8px;
  box-sizing: border-box;
  background: transparent;  /* keep same look as before */
  color: inherit;
}

/* small visual cue while dragging */
#historyList .history-item .history-token.dragging 
{
  opacity: 0.95;
  user-select: none;
}

/* ensure delete button keeps its spacing */
#historyList .history-item .delete-entry 
{
  margin-left: 8px;
}

                buttonBg: '--button-bg',
                buttonText: '--button-text',
                operatorColor: '--operator-color',
                clearColor: '--clear-color',
                equalBg: '--equal-bg',
                equalText: '--equal-text',
                inputNumberColor: '--input-number-color',
                inputOperatorColor: '--input-operator-color'
            };
            if (key === 'animDuration') {
                settings.animDuration = color;
            } else if (key === 'caretBlinkInterval') {
                settings.caretBlinkInterval = color;
                const ms = parseInt(color) || 1000;
                document.documentElement.style.setProperty('--caret-blink-interval', ms + "ms");
                customCaret.style.animationDuration = ms + "ms";
            }
            
            else if (key === 'historyLimit') 
            {
                settings.historyLimit = color;
            }
            
            else {
                const varName = varNameMap[key];
                if (varName) {
                    document.documentElement.style.setProperty(varName, color);
                    settings[key] = color;
                }
            }
        }
        btnSettings.addEventListener('click', () => {
            settingsOverlay.style.display = 'flex';
        });
        closeSettings.addEventListener('click', () => {
            settingsOverlay.style.display = 'none';
        });

        btnSaveSettings.addEventListener('click', () => {
          const s = {};
          for (let key in settingInputs) {
            const elem = settingInputs[key];
            if (!elem) continue;
            let val;
            if (elem.type === 'checkbox') {
              val = elem.checked ? '1' : '0';
            } else {
              val = elem.value;
            }
            s[key] = val;
            // applySetting only for keys that affect CSS/behavior via applySetting
            if (elem.type === 'checkbox') {
              // store into settings so runtime code can read it
              settings[key] = val;
            } else {
              applySetting(key, val);
            }
          }
          try { localStorage.setItem('calcSettings', JSON.stringify(s)); } catch (e) {}
          settingsOverlay.style.display = 'none';
          updateDisplay();
          alert("Settings saved.");
        });

        btnRestoreDefaults.addEventListener('click', () => {
          if (!confirm("Restore default theme settings?")) return;
          for (let key in defaultSettings) {
            if (!settingInputs[key]) continue;
            const elem = settingInputs[key];
            const def = defaultSettings[key];
            if (elem.type === 'checkbox') {
              elem.checked = (def === '1');
              settings[key] = def;
            } else {
              elem.value = def;
              applySetting(key, def);
            }
          }
          try { localStorage.setItem('calcSettings', JSON.stringify(defaultSettings)); } catch (e) {}
          alert("Defaults restored.");
          updateDisplay();
        });
        
        btnExportSettings.addEventListener('click', () => {
            const s = {};
            for (let key in settingInputs) {
                const val = settingInputs[key].value;
                if (val !== undefined) s[key] = val;
            }
            const dataStr = JSON.stringify(s, null, 2);
            const blob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'calculator_settings.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
        
        btnImportSettings.addEventListener('click', () => {
            settingsFileInput.value = '';
            settingsFileInput.click();
        });
        settingsFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const imported = JSON.parse(ev.target.result);
                    let changed = false;
                    for (let key in settingInputs) {
                        if (imported[key] !== undefined) {
                            settingInputs[key].value = imported[key];
                            applySetting(key, imported[key]);
                            changed = true;
                        }
                    }
                    if (changed) {
                        localStorage.setItem('calcSettings', JSON.stringify(imported));
                        alert("Settings imported.");
                        updateDisplay();
                    } else {
                        alert("No valid settings in file.");
                    }
                } catch {
                    alert("Failed to parse settings file.");
                }
            };
            reader.readAsText(file);
        });
        
        function testPatternInString(text, patternStr, options = {}) 
        {
    const { literal = false, flags: userFlags = "", caseInsensitive = false } = options;
    let flags = userFlags || "";
    if (caseInsensitive && !flags.includes("i")) {
        flags += "i";
    }
    let regex;
    if (literal) {
        // Escape all regex special chars so patternStr is taken literally
        const escaped = patternStr.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        regex = new RegExp(escaped, flags);
    } else {
        // Try to build RegExp from patternStr directly
        try {
            regex = new RegExp(patternStr, flags);
        } catch (e) {
            // On invalid pattern, fallback to literal match
            const escaped = patternStr.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            regex = new RegExp(escaped, flags);
        }
    }
    return regex.test(text);
        }

        function isOnlyAllowedChars(text, allowedPattern, options = {}) 
        {
            if (typeof text !== 'string') return false;
            let charRegex;
        
            if (allowedPattern instanceof RegExp) {
                // Remove global or sticky flags to avoid lastIndex issues
                const flags = (allowedPattern.flags || '').replace(/[gy]/g, '');
                charRegex = new RegExp('^(?:' + allowedPattern.source + ')$', flags);
            } else if (typeof allowedPattern === 'string') {
                // Escape each character for regex character class
                const escaped = allowedPattern.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&');
                const flags = options.caseInsensitive ? 'i' : '';
                charRegex = new RegExp('^[' + escaped + ']$', flags);
            } else {
                // Unsupported pattern type
                return false;
            }
        
            for (let ch of text) {
                if (!charRegex.test(ch)) {
                    return false;
                }
            }
            return true;
        }

        function clamp(n, min, max) 
        {
            return n < min ? min : n > max ? max : n;
        }

        // Escape HTML special chars
function escapeHtml(str) {
    return str.replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#39;");
}

        // Format a numeric token (with possible sign, decimals, exponent, percent) into display string with commas and uppercase E
function formatNumberToken(token) {
    // token: e.g. "-123.45E-6%", or "1234", or "+56%", etc.
    // Separate percent
    let isPercent = false;
    if (token.endsWith('%')) {
        isPercent = true;
        token = token.slice(0, -1);
    }
    // Separate exponent
    let main = token;
    let expPart = null;
    const eIndex = token.search(/e/i);
    if (eIndex !== -1) {
        main = token.slice(0, eIndex);
        expPart = token.slice(eIndex + 1); // includes sign and digits
    }
    // Separate sign
    let sign = '';
    if (main.startsWith('+') || main.startsWith('-')) {
        sign = main[0];
        main = main.slice(1);
    }
    // Split integer and decimal
    let intPart = main;
    let decPart = null;
    if (main.includes('.')) {
        const parts = main.split('.');
        intPart = parts[0];
        decPart = parts[1];
    }
    // Insert commas in intPart
    // Remove leading zeros? We keep as is, just group digits
    const rev = intPart.split('').reverse();
    const grouped = [];
    for (let k = 0; k < rev.length; k++) {
        grouped.push(rev[k]);
        if ((k + 1) % 3 === 0 && k + 1 < rev.length) {
            grouped.push(',');
        }
    }
    intPart = grouped.reverse().join('');
    // Reassemble
    let result = sign + intPart + (decPart !== null ? '.' + decPart : '');
    if (expPart !== null) {
        result += 'E' + expPart.toUpperCase();
    }
    if (isPercent) {
        result += '%';
    }
    return result.toUpperCase();
}

        function isPromptInString(text, prompt, options = {}) 
        {
          if (prompt instanceof RegExp) {
              return prompt.test(text);
          }
          // prompt is string
          const { caseInsensitive = false } = options;
          if (caseInsensitive) {
              return text.toLowerCase().includes(prompt.toLowerCase());
          }
          return text.includes(prompt);
        }
      
        function rgbToHex(rgb) {
            if (typeof rgb !== 'string') return '';
            const str = rgb.trim();
            if (str.startsWith('#')) return str;
            const m = str.match(/rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})(?:\s*,\s*(\d*\.?\d+))?\s*\)/i);
            if (!m) return '';
            const r = parseInt(m[1], 10);
            const g = parseInt(m[2], 10);
            const b = parseInt(m[3], 10);
            const clampByte = v => Math.max(0, Math.min(255, v));
            const hr = clampByte(r).toString(16).padStart(2, '0');
            const hg = clampByte(g).toString(16).padStart(2, '0');
            const hb = clampByte(b).toString(16).padStart(2, '0');
            let hex = `#${hr}${hg}${hb}`;
            if (m[4] !== undefined) {
                let a = parseFloat(m[4]);
                a = Math.max(0, Math.min(1, isNaN(a) ? 1 : a));
                const alphaInt = Math.round(a * 255);
                const ha = alphaInt.toString(16).padStart(2, '0');
                hex += ha;
            }
            return hex;
        }
        
        function hexToRgb(hex) {
            if (typeof hex !== 'string') return null;
            let h = hex.trim().replace(/^#/, '');
            if (![3,4,6,8].includes(h.length)) return null;
            if (h.length === 3 || h.length === 4) {
                h = h.split('').map(ch => ch + ch).join('');
            }
            const r = parseInt(h.slice(0, 2), 16);
            const g = parseInt(h.slice(2, 4), 16);
            const b = parseInt(h.slice(4, 6), 16);
            if (h.length === 6) {
                return `rgb(${r}, ${g}, ${b})`;
            } else {
                const a = parseInt(h.slice(6, 8), 16) / 255;
                const aStr = Math.round(a * 100) / 100;
                return `rgba(${r}, ${g}, ${b}, ${aStr})`;
            }
        }

    loadHistory();
    loadSettings();
    updateDisplay();
    updateButtons();
    })();
